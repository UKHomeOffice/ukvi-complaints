services:
  hof-ukvic-app:
    env_file: devcontainer.env
    build:
      context: .
      dockerfile: Dockerfile
    
    networks:
      - ukvic-shared-network
    ports:
      - "8080:8080"
    hostname: hof-app
    depends_on:
      - redis
      - file-vault
      - rds-api
      - sqs-mock

    volumes:
      # Update this to wherever you want VS Code to mount the folder of your project
      - ..:/app:cached

    # Overrides default command so things don't shut down after the process ends.
    # command: /bin/sh -c "while sleep 1000; do :; done"
    command: sleep infinity

  redis:
    image: "redis:alpine"
    networks:
      - ukvic-shared-network
    hostname: hof-redis
    ports:
      - "6379:6379"

  file-vault:
    env_file: devcontainer.env
    image: quay.io/ukhomeofficedigital/file-vault:3.2.0
    platform: linux/amd64
    networks:
      - ukvic-shared-network
    hostname: hof-file-vault
    environment:
      - DEBUG=*
      - CLAMAV_REST_URL=http://clamav:3999/scan
      - AWS_ACCESS_KEY_ID=aws-access-key-id
      - AWS_SECRET_ACCESS_KEY=aws-secret-access-key
      - AWS_REGION=eu-west-1
      - AWS_SIGNATURE_VERSION=v4
      - AWS_BUCKET=aws-bucket
      - AWS_ENDPOINT=http://local-s3:80
      - AWS_EXPIRY_TIME=600
      - AWS_PASSWORD=aws-password
      - FILE_EXTENSION_WHITELIST=pdf,jpg,jpeg,png
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_started
      local-s3-init:
        condition: service_completed_successfully

  clamav:
    image: node:24.18.0-alpine3.24
    networks:
      - ukvic-shared-network
    hostname: clamav
    command: ["node", "-e", "require('http').createServer((req, res) => res.end('true')).listen(3999)"]
    restart: unless-stopped

  local-s3:
    image: luofuxiang/local-s3:latest
    networks:
      - ukvic-shared-network
    volumes:
      - local-s3-data:/data

  local-s3-init:
    image: amazon/aws-cli:2.17.43
    networks:
      - ukvic-shared-network
    depends_on:
      - local-s3
    environment:
      - AWS_ACCESS_KEY_ID=aws-access-key-id
      - AWS_SECRET_ACCESS_KEY=aws-secret-access-key
      - AWS_DEFAULT_REGION=eu-west-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        until aws --endpoint-url http://local-s3:80 s3api list-buckets >/dev/null 2>&1; do
          sleep 1
        done

        if ! aws --endpoint-url http://local-s3:80 s3api head-bucket --bucket aws-bucket >/dev/null 2>&1; then
          aws --endpoint-url http://local-s3:80 s3api create-bucket --bucket aws-bucket >/dev/null
        fi

  rds-api:
    image: quay.io/ukhomeofficedigital/hof-rds-api:3.5.0@sha256:a2db461460894530de77def109e6c4e42df724126091f16c5ae7127d5856a115
    platform: linux/amd64
    networks:
      - ukvic-shared-network
    hostname: hof-rds-api
    environment:
      - SERVICE_NAME=ukvic
      - PORT=5000
      - NODE_ENV=development
      - DB_HOST=hof-postgres
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=ukvic
    ports:
      - "5000:5000"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:14
    networks:
      - ukvic-shared-network
    hostname: hof-postgres
    environment:
      PGUSER: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ukvic
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10
  sqs-mock:
    platform: linux/amd64
    build:
      context: ../test/_integration/sqs-mock
    container_name: sqs-mock
    networks:
      - ukvic-shared-network
    ports:
      - "9324:9324"

  playwright-run:
    image: mcr.microsoft.com/playwright:v1.48.2-focal-amd64
    container_name: playwright-run
    environment:
      - ACCEPTANCE_HOST_NAME=http://hof-ukvic-app:8080
      - CUCUMBER_PUBLISH_ENABLED=false
    networks:
      - ukvic-shared-network
    ports:
      - "9325:9325"
    volumes:
      - ..:/workspace
    working_dir: /workspace
    command: ["bash", "-c", "yarn playwright install && tail -f /dev/null"]

networks:
  ukvic-shared-network:
    driver: bridge

volumes:
  pgdata:
  local-s3-data:
